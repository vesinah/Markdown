<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg2)" />

  <!-- Header -->
  <rect x="50" y="30" width="1100" height="90" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)" />
  <text x="600" y="68" text-anchor="middle" font-family="'Sarabun', Arial, sans-serif" font-size="26" font-weight="bold" fill="url(#gold2)">
    การตัดตอนประวัติศาสตร์: สารบบรายพระนามกษัตริย์ทางการ เทียบกับ ความเป็นจริงแห่งยุคอามาร์นา
  </text>
  <text x="600" y="98" text-anchor="middle" font-family="'Sarabun', Arial, sans-serif" font-size="15" fill="#94a3b8">
    กลไกการลบล้างความทรงจำ (Damnatio Memoriae) ของราชวงศ์ที่ 19 ผ่าน Abydos King List และ Saqqara Tablet
  </text>

  <!-- Left Column: Official Pharaonic Record (The Erasure) -->
  <g transform="translate(60, 150)">
    <rect width="520" height="660" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#shadow2)" />
    
    <!-- Header of Left Column -->
    <rect x="20" y="20" width="480" height="50" rx="8" fill="url(#redGrad)" />
    <text x="260" y="52" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#fff">
      บันทึกทางการของรัฐ (Abydos &amp; Saqqara King Lists)
    </text>

    <!-- Cartouche 73: Amenhotep III -->
    <g transform="translate(40, 95)">
      <rect width="440" height="85" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <!-- Cartouche Oval -->
      <rect x="20" y="15" width="120" height="55" rx="27" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#ecfdf5">Nb-mꜢꜤt-RꜤ</text>
      <text x="160" y="40" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" fill="#34d399">ลำดับที่ 73: เนบมาอัตเร (อเมนโฮเทปที่ 3)</text>
      <text x="160" y="62" font-family="'Sarabun', sans-serif" font-size="13" fill="#94a3b8">ครองราชย์ราว 38 ปี | ยุคทองแห่งความรุ่งเรืองของจักรวรรดิ</text>
    </g>

    <!-- THE GAP / ERASURE ZONE -->
    <g transform="translate(40, 205)">
      <rect width="440" height="235" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" />
      <line x1="30" y1="30" x2="410" y2="205" stroke="#ef4444" stroke-width="3" opacity="0.6" />
      <line x1="410" y1="30" x2="30" y2="205" stroke="#ef4444" stroke-width="3" opacity="0.6" />
      
      <rect x="90" y="30" width="260" height="36" rx="18" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5" />
      <text x="220" y="54" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#fef2f2">
        ช่องว่างประวัติศาสตร์ 34 ปีที่ถูกลบ
      </text>

      <text x="220" y="95" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" fill="#fca5a5">
        กษัตริย์ 4 พระองค์ถูกตัดทิ้งอย่างสิ้นเชิง:
      </text>
      <text x="220" y="125" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#fecaca">
        [1] อัคเคนาเตน (Akhenaten) — 17 ปี
      </text>
      <text x="220" y="150" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#fecaca">
        [2] สเมนคาเร / เนเฟอร์เนเฟรูอาเตน — 3 ปี
      </text>
      <text x="220" y="175" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#fecaca">
        [3] ตุตันคาเมน (Tutankhamun) — 10 ปี
      </text>
      <text x="220" y="200" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#fecaca">
        [4] อัยย์ (Ay) — 4 ปี
      </text>
    </g>

    <!-- Cartouche 74: Horemheb -->
    <g transform="translate(40, 465)">
      <rect width="440" height="85" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="20" y="15" width="120" height="55" rx="27" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#f0f9ff">Ḏsr-ḫpr.w-RꜤ</text>
      <text x="160" y="40" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" fill="#38bdf8">ลำดับที่ 74: เจเซอร์เคเปรูเร (โฮเรมเฮบ)</text>
      <text x="160" y="62" font-family="'Sarabun', sans-serif" font-size="13" fill="#94a3b8">ผนวกปีครองราชย์ 34 ปีที่ถูกลบ เข้าเป็นปีที่ 59 ของตนเอง</text>
    </g>

    <!-- Note on Left Column -->
    <rect x="40" y="570" width="440" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="260" y="598" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="13" fill="#cbd5e1">
      ในเอกสารศาลยุครามเสสสิด (Inscription of Mes)
    </text>
    <text x="260" y="622" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#f87171">
      อัคเคนาเตนถูกประณามว่า "ศัตรูแห่งอาเคตอาเตน" (pꜢ ḫrw n Ꜣḫ.t-jtn)
    </text>
  </g>

  <!-- Right Column: Historical Reality & Forensic Recovery -->
  <g transform="translate(620, 150)">
    <rect width="520" height="660" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow2)" />

    <!-- Header of Right Column -->
    <rect x="20" y="20" width="480" height="50" rx="8" fill="url(#greenGrad)" />
    <text x="260" y="52" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#fff">
      ความเป็นจริงทางประวัติศาสตร์ (โบราณคดี &amp; พันธุศาสตร์)
    </text>

    <!-- Phase 1: Akhenaten -->
    <g transform="translate(40, 95)">
      <rect width="440" height="90" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <rect x="15" y="15" width="130" height="60" rx="30" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
      <text x="80" y="42" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fef3c7">Nfr-ḫpr.w-RꜤ</text>
      <text x="80" y="58" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fde68a">WꜤ-n-RꜤ</text>
      <text x="160" y="38" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">อัคเคนาเตน (ปีที่ 1–17 | ~1353–1336 BC)</text>
      <text x="160" y="58" font-family="'Sarabun', sans-serif" font-size="12" fill="#cbd5e1">• สถาปนาลัทธิอาเตน ย้ายเมืองหลวงสู่ Akhetaten</text>
      <text x="160" y="76" font-family="'Sarabun', sans-serif" font-size="12" fill="#94a3b8">• จารึกปีที่ 16 ยืนยันเนเฟอร์ตีติร่วมปกครองจนบั้นปลาย</text>
    </g>

    <!-- Phase 2: Smenkhkare & Neferneferuaten -->
    <g transform="translate(40, 200)">
      <rect width="440" height="100" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <rect x="15" y="18" width="130" height="64" rx="32" fill="#581c87" stroke="#c084fc" stroke-width="2" />
      <text x="80" y="45" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#faf5ff">Ꜥnḫ-ḫpr.w-RꜤ</text>
      <text x="80" y="62" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#e9d5ff">Nfr-nfr.w-Jtn (.t)</text>
      <text x="160" y="36" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#c084fc">สเมนคาเร &amp; เนเฟอร์เนเฟรูอาเตน (~3 ปี)</text>
      <text x="160" y="56" font-family="'Sarabun', sans-serif" font-size="12" fill="#cbd5e1">• สเมนคาเร (บุรุษ) ร่วมครองราชย์สั้นๆ</text>
      <text x="160" y="74" font-family="'Sarabun', sans-serif" font-size="12" fill="#cbd5e1">• เนเฟอร์เนเฟรูอาเตน (กษัตริย์สตรี/เนเฟอร์ตีติ) ฉายานาม</text>
      <text x="160" y="90" font-family="'Sarabun', sans-serif" font-size="11" fill="#e9d5ff">  Akhet-en-hyes ("ผู้ทรงคุณประโยชน์ต่อพระสวามี")</text>
    </g>

    <!-- Phase 3: Tutankhamun -->
    <g transform="translate(40, 315)">
      <rect width="440" height="90" rx="10" fill="#0f172a" stroke="#eab308" stroke-width="1.5" />
      <rect x="15" y="15" width="130" height="60" rx="30" fill="#713f12" stroke="#facc15" stroke-width="2" />
      <text x="80" y="42" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fef9c3">Nb-ḫpr.w-RꜤ</text>
      <text x="80" y="58" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fef08a">Twt-Ꜥnḫ-Jmn</text>
      <text x="160" y="38" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#facc15">ตุตันคาเมน (ปีที่ 1–10 | ~1332–1323 BC)</text>
      <text x="160" y="58" font-family="'Sarabun', sans-serif" font-size="12" fill="#cbd5e1">• ออกศิลาจารึกฟื้นฟู (Restoration Stela CG 34183)</text>
      <text x="160" y="76" font-family="'Sarabun', sans-serif" font-size="12" fill="#94a3b8">• ย้ายเมืองหลวงกลับสู่ธีบส์และเมมฟิส</text>
    </g>

    <!-- Phase 4: Ay -->
    <g transform="translate(40, 420)">
      <rect width="440" height="75" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <rect x="15" y="12" width="130" height="50" rx="25" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <text x="80" y="42" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#f8fafc">Ḫpr-ḫpr.w-RꜤ</text>
      <text x="160" y="36" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0">อัยย์ (Ay - ปีที่ 1–4 | ~1323–1319 BC)</text>
      <text x="160" y="56" font-family="'Sarabun', sans-serif" font-size="12" fill="#94a3b8">• ขุนนางอาวุโสผู้จัดพิธีฝังพระศพตุตันคาเมน</text>
    </g>

    <!-- Phase 5: Horemheb Restoration -->
    <g transform="translate(40, 510)">
      <rect width="440" height="75" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <rect x="15" y="12" width="130" height="50" rx="25" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="80" y="42" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#f0f9ff">Ḏsr-ḫpr.w-RꜤ</text>
      <text x="160" y="36" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">โฮเรมเฮบ (Horemheb | ~1319–1292 BC)</text>
      <text x="160" y="56" font-family="'Sarabun', sans-serif" font-size="12" fill="#94a3b8">• รื้อถอนเมืองอาเคตอาเตนและวิหารคาร์นักอย่างเบ็ดเสร็จ</text>
    </g>

    <!-- Forensic DNA Validation Tag -->
    <rect x="40" y="600" width="440" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="260" y="626" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">
      ✓ ยืนยันด้วยดีเอ็นเอโบราณ (JAMA 2010): KV55 คือบิดาทางสายเลือดของตุตันคาเมน
    </text>
  </g>

  <!-- Bottom Note -->
  <text x="600" y="865" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="13" fill="#64748b">
    ภาพอินโฟกราฟิกวิชาการประกอบรายงานวิจัย: ประวัติศาสตร์นิพนธ์อามาร์นา © 2026 | แหล่งข้อมูล: Abydos King List, Saqqara Tablet, JAMA 2010
  </text>
</svg>
