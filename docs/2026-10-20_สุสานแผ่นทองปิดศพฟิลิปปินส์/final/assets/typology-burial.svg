<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">การจำแนกประเภทพิธีกรรมศพ: การฝังปฐมภูมิ ทุติยภูมิ และการเผาศพ</text>
  <rect x="50" y="80" width="210" height="320" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="115" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">การฝังครั้งที่หนึ่ง</text>
  <text x="155" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#3b82f6">(Primary Inhumation)</text>
  <rect x="70" y="160" width="170" height="80" rx="6" fill="#dbeafe"/>
  <text x="155" y="195" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">ร่างสมบูรณ์ / โครงกระดูกต่อชิ้น</text>
  <text x="155" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">(Articulated Skeleton)</text>
  <text x="155" y="270" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b45309">บริบทแผ่นทองปิดศพ:</text>
  <text x="155" y="295" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• โอตอน Grave 6</text>
  <text x="155" y="315" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• เซบู Burial 17</text>
  <text x="155" y="335" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• บูตูอัน โลงไม้รูปเรือ</text>
  <rect x="295" y="80" width="210" height="320" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="400" y="115" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#854d0e">การฝังครั้งที่สอง</text>
  <text x="400" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04">(Secondary Burial)</text>
  <rect x="315" y="160" width="170" height="80" rx="6" fill="#fef9c3"/>
  <text x="400" y="195" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#713f12">เก็บกระดูกบรรจุไห / ถ้ำ</text>
  <text x="400" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#854d0e">(Disarticulated in Jars)</text>
  <text x="400" y="270" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">บริบทโบราณคดี:</text>
  <text x="400" y="295" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• ถ้ำมานุงกุล ปาลาวัน</text>
  <text x="400" y="315" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• ถ้ำอายับ ไมตุม</text>
  <text x="400" y="335" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">• ไหฝังศพซานเรมิคิโอ</text>
  <rect x="540" y="80" width="210" height="320" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="645" y="115" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">การเผาศพ</text>
  <text x="645" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#dc2626">(Cremation)</text>
  <rect x="560" y="160" width="170" height="80" rx="6" fill="#fee2e2"/>
  <text x="645" y="195" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7f1d1d">เผาสรีระเป็นเถ้าถ่าน</text>
  <text x="645" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#991b1b">(Ash &amp; Calcined Bone)</text>
  <text x="645" y="270" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">สถานภาพในพื้นที่วิจัย:</text>
  <text x="645" y="295" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c">ไม่พบใน 3 แหล่งสุสาน</text>
  <text x="645" y="315" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#475569">• พบเฉพาะยุคหินถ้ำอิลเล</text>
  <text x="645" y="335" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#475569">• ชุมชนปฏิเสธคติเผาศพ</text>
</svg>