<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">ผังโครงสร้างการเลือกรับทางวัฒนธรรม: เหตุใดจึงฝังแต่ไม่เผาศพ</text>
  <rect x="50" y="70" width="320" height="150" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="210" y="100" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">อิทธิพลอินเดีย (Indianization)</text>
  <text x="210" y="130" font-family="sans-serif" font-size="12" fill="#4c1d95">• เทวรูปทองคำอากูซัน (มหายาน-วัชรยาน)</text>
  <text x="210" y="155" font-family="sans-serif" font-size="12" fill="#4c1d95">• จารึกทองแดงลากูนา (มหาศักราช 822)</text>
  <text x="210" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">รับเป็น "วัตถุบารมีและการค้า" เท่านั้น</text>
  <rect x="430" y="70" width="320" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="100" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">จักรวาลวิทยาออสโตรนีเซียนดั้งเดิม</text>
  <text x="590" y="130" font-family="sans-serif" font-size="12" fill="#78350f">• คติบรรพชนนิยม (Anito / Diwata)</text>
  <text x="590" y="155" font-family="sans-serif" font-size="12" fill="#78350f">• วิญญาณต้องการร่าง/กระดูกเป็นที่สถิต</text>
  <text x="590" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">การเผาศพ = ทำลายเรือนร่างบรรพชน</text>
  <rect x="200" y="260" width="400" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="400" y="295" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#065f46">ผลลัพธ์ทางสุสานวิทยา (Mortuary Outcome)</text>
  <text x="400" y="330" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#047857">ธำรงธรรมเนียมการฝังศพปฐมภูมิ (Primary Inhumation)</text>
  <text x="400" y="355" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#064e3b">• ถนอมร่างด้วยน้ำยางพลู (Buyo Sap) ในโลงไม้</text>
  <text x="400" y="375" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#064e3b">• สวมแผ่นทองคำปิดทวารเพื่อพิทักษ์ร่างและเชิดชูเกียรติยศ</text>
</svg>