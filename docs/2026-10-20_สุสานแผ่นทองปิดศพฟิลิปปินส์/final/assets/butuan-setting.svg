<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">ภูมิทัศน์ลุ่มน้ำและโลงไม้รูปเรือแหล่งบูตูอัน (Butuan Delta &amp; Boat Coffin)</text>
  <path d="M 0,180 Q 200,120 400,200 T 800,160 L 800,450 L 0,450 Z" fill="#67e8f9" opacity="0.4"/>
  <text x="700" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0891b2">แม่น้ำอากูซัน (Agusan River)</text>
  <path d="M 50,150 Q 250,100 450,160 T 750,130 L 750,260 Q 450,290 250,230 T 50,270 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="250" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">แนวคันดินธรรมชาติริมน้ำ (Natural Levee: แหล่งซูอาตัน/อัมบางัน)</text>
  <path d="M 180,330 Q 350,300 520,330 L 500,380 Q 350,390 200,380 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <text x="350" y="355" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">โลงไม้ขุดรูปเรือ (Boat-shaped Coffin in Waterlogged Silt)</text>
  <circle cx="230" cy="355" r="10" fill="#e2e8f0"/>
  <circle cx="230" cy="355" r="4" fill="#f59e0b"/>
  <text x="350" y="420" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#475569">ฝังในชั้นดินเหนียวอิ่มน้ำไร้ออกซิเจน (Anaerobic Silt) ถนอมเนื้อไม้และรักษาสภาพโครงกระดูก</text>
</svg>