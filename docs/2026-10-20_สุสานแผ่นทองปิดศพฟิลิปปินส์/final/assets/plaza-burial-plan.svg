<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">ผังจำลองหลุมฝังศพหมายเลข 17 แหล่งปลาซา อินเดเปนเดนเซีย เซบู</text>
  <rect x="150" y="70" width="500" height="320" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">หลุมศพเปิดปฐมภูมิ (Primary Inhumation Burial 17)</text>
  <text x="530" y="100" font-family="sans-serif" font-size="12" fill="#0369a1">ทิศศีรษะ: ตะวันตกเฉียงเหนือ</text>
  <circle cx="260" cy="220" r="30" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="290" y="210" width="170" height="25" rx="5" fill="#cbd5e1"/>
  <rect x="460" y="200" width="140" height="18" rx="4" fill="#cbd5e1"/>
  <rect x="460" y="225" width="140" height="18" rx="4" fill="#cbd5e1"/>
  <ellipse cx="250" cy="215" rx="10" ry="6" fill="#f59e0b" stroke="#78350f"/>
  <ellipse cx="270" cy="228" rx="8" ry="4" fill="#f59e0b" stroke="#78350f"/>
  <text x="260" y="280" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">แผ่นทองปิดตาและปาก</text>
  <polygon points="340,250 430,253 430,259 340,256" fill="#475569"/>
  <text x="385" y="275" font-family="sans-serif" font-size="11" fill="#334155">กริชเหล็ก (Iron Dagger)</text>
  <circle cx="220" cy="170" r="15" fill="#6ee7b7" stroke="#047857"/>
  <circle cx="215" cy="270" r="15" fill="#6ee7b7" stroke="#047857"/>
  <circle cx="615" cy="220" r="18" fill="#93c5fd" stroke="#1d4ed8"/>
  <text x="400" y="420" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#475569">ร่วมกับเครื่องเคลือบหยวน-หมิงตอนต้น ลูกปัดหินคาร์เนเลียน และอาวุธเหล็กข้างลำตัว</text>
</svg>