<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', 'Sarabun', 'Helvetica Neue', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="goldHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="cardGradEco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGradEcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGradTrade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGradCosmo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGradSci" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Filter for glowing shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feFlood flood-color="#fbbf24" flood-opacity="0.3" result="color" />
      <feComposite in2="blur" operator="in" result="shadow" />
      <feComposite in="SourceGraphic" in2="shadow" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,100 L 1600,100 M 0,200 L 1600,200 M 0,300 L 1600,300 M 0,400 L 1600,400 M 0,500 L 1600,500 M 0,600 L 1600,600 M 0,700 L 1600,700 M 0,800 L 1600,800 M 0,900 L 1600,900 M 0,100 L 1600,1000" />
    <path d="M 100,0 L 100,1100 M 200,0 L 200,1100 M 300,0 L 300,1100 M 400,0 L 400,1100 M 500,0 L 500,1100 M 600,0 L 600,1100 M 700,0 L 700,1100 M 800,0 L 800,1100 M 900,0 L 900,1100 M 1000,0 L 1000,1100 M 1100,0 L 1100,1100 M 1200,0 L 1200,1100 M 1300,0 L 1300,1100 M 1400,0 L 1400,1100 M 1500,0 L 1500,1100" />
  </g>

  <!-- Title Header -->
  <g id="headerGroup" transform="translate(80, 45)">
    <rect x="0" y="0" width="8" height="65" fill="#f59e0b" rx="4" />
    <text x="25" y="28" fill="#f8fafc" font-size="26" font-weight="bold" letter-spacing="0.5">แบบจำลองกระบวนทัศน์องค์รวม: วัฒนธรรมทองคำพิธีศพ เครือข่ายพาณิชย์นาวี และจักรวาลวิทยา</text>
    <text x="25" y="55" fill="#94a3b8" font-size="16">GRAND SYNTHESIS PARADIGM MODEL: PRECOLONIAL PHILIPPINE MORTUARY GOLD HORIZON &amp; PAN-ASIAN MARITIME NETWORKS</text>
  </g>

  <!-- Central Hub: Mortuary Gold Mask & Orifice Plaque Complex -->
  <g id="centralHub" transform="translate(800, 520)" filter="url(#goldGlow)">
    <!-- Outer Orbit Ring -->
    <circle r="190" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite" />
    </circle>
    <circle r="150" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" />
    
    <!-- Central Node Body -->
    <circle r="125" fill="url(#hubGrad)" stroke="#fef08a" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Gold Mask Icon Silhouette -->
    <path d="M -45,-35 C -45,-35 -20,-48 0,-48 C 20,-48 45,-35 45,-35 C 55,-10 50,25 35,45 C 20,60 0,65 0,65 C 0,65 -20,60 -35,45 C -50,25 -55,-10 -45,-35 Z" fill="#451a03" stroke="#fef08a" stroke-width="2" opacity="0.85" />
    <!-- Eyes -->
    <ellipse cx="-20" cy="-15" rx="12" ry="6" fill="#fef08a" />
    <ellipse cx="20" cy="-15" rx="12" ry="6" fill="#fef08a" />
    <!-- Nose bridge / cover -->
    <polygon points="0,-10 -8,12 8,12" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
    <!-- Mouth cover -->
    <ellipse cx="0" cy="28" rx="18" ry="5" fill="#fef08a" stroke="#78350f" stroke-width="1" />

    <!-- Central Node Text -->
    <text x="0" y="-60" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">แกนกลางอุดมการณ์และวัตถุภาพ</text>
    <text x="0" y="80" text-anchor="middle" fill="#fef08a" font-size="16" font-weight="bold">วัฒนธรรมทองคำปิดทวารศพ</text>
    <text x="0" y="98" text-anchor="middle" fill="#fde68a" font-size="12">MORTUARY GOLD ORIFICE COMPLEX</text>
    <text x="0" y="114" text-anchor="middle" fill="#cbd5e1" font-size="11">(โอตอน • บูตูอัน • เซบูปลาซา • สุริเกา)</text>
  </g>

  <!-- Connective Arrows & Conduits -->
  <!-- Conduits from Peripheral Pillars to Central Hub -->
  <g stroke-linecap="round" opacity="0.75">
    <!-- Top-Left: Ecology -> Hub -->
    <line x1="390" y1="280" x2="685" y2="445" stroke="#10b981" stroke-width="3" stroke-dasharray="5,5" />
    <polygon points="695,450 680,440 685,455" fill="#10b981" />

    <!-- Top-Right: Trade & Maritime -> Hub -->
    <line x1="1210" y1="280" x2="915" y2="445" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,5" />
    <polygon points="905,450 915,455 920,440" fill="#3b82f6" />

    <!-- Bottom-Left: Political Economy -> Hub -->
    <line x1="390" y1="760" x2="685" y2="595" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5" />
    <polygon points="695,590 685,585 680,600" fill="#f59e0b" />

    <!-- Bottom-Right: Cosmology & Ritual -> Hub -->
    <line x1="1210" y1="760" x2="915" y2="595" stroke="#a855f7" stroke-width="3" stroke-dasharray="5,5" />
    <polygon points="905,590 920,600 915,585" fill="#a855f7" />

    <!-- Inter-Pillar Horizontal Links -->
    <!-- Top Link: Ecology <-> Trade -->
    <path d="M 460,190 Q 800,120 1140,190" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="800" y="145" text-anchor="middle" fill="#94a3b8" font-size="12">ทรัพยากรธรรมชาติและแร่ทองคำ หล่อเลี้ยงเส้นทางพาณิชย์นาวี</text>

    <!-- Bottom Link: Economy <-> Cosmology -->
    <path d="M 460,860 Q 800,940 1140,860" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="800" y="920" text-anchor="middle" fill="#94a3b8" font-size="12">อำนาจบารมีดาตู แปลงเปลี่ยนเป็นความศักดิ์สิทธิ์และพิธีกรรมข้ามภพ</text>
  </g>

  <!-- PILLAR 1 (Top-Left): นิเวศวิทยา ชัยภูมิ และแหล่งวัตถุดิบ (Physical & Metallurgical Base) -->
  <g id="pillarEcology" transform="translate(80, 150)">
    <rect width="380" height="240" rx="14" fill="url(#cardGradEco)" stroke="#059669" stroke-width="2" filter="url(#glow)" />
    <!-- Header Badge -->
    <rect x="0" y="0" width="380" height="42" rx="14" fill="#065f46" />
    <rect x="15" y="12" width="18" height="18" rx="4" fill="#10b981" />
    <text x="42" y="26" fill="#ecfdf5" font-size="16" font-weight="bold">1. ฐานนิเวศน์วิทยาและแหล่งแร่ทองคำ</text>
    
    <!-- Content Items -->
    <g transform="translate(18, 62)" font-size="13" fill="#d1fae5">
      <circle cx="5" cy="5" r="3.5" fill="#34d399" />
      <text x="16" y="9" font-weight="600">สายแร่ทองคำปฐมภูมิ-ทุติยภูมิ (Placer &amp; Lode):</text>
      <text x="16" y="27" fill="#a7f3d0" font-size="12">• ลุ่มน้ำอากูซาน-สุริเกา (Agusan Valley) เกาะมินดาเนา</text>
      <text x="16" y="44" fill="#a7f3d0" font-size="12">• เทือกเขาตอนกลางลูซอน และแม่น้ำปานาย</text>

      <circle cx="5" cy="65" r="3.5" fill="#34d399" />
      <text x="16" y="69" font-weight="600">ชัยภูมิชุมชนเมืองท่าปากแม่น้ำ (Estuarine Nodes):</text>
      <text x="16" y="87" fill="#a7f3d0" font-size="12">• ทางออกสู่ทะเลเปิด เชื่อมโยงแนวปะการังและแม่น้ำ</text>
      <text x="16" y="104" fill="#a7f3d0" font-size="12">• บูตูอัน (ปากน้ำอากูซาน), เซบู (ช่องแคบ), โอตอน (ช่องแคบอีโลอีโล)</text>

      <circle cx="5" cy="125" r="3.5" fill="#34d399" />
      <text x="16" y="129" font-weight="600">โลหวิทยาพื้นถิ่น (Indigenous Metallurgy):</text>
      <text x="16" y="147" fill="#a7f3d0" font-size="12">• การร่อนทอง (Pangangayaw), เบ้าหลอมดินเหนียว</text>
      <text x="16" y="164" fill="#a7f3d0" font-size="12">• ตีแผ่นบางพิเศษ (Cold hammering &amp; Annealing)</text>
    </g>
  </g>

  <!-- PILLAR 2 (Top-Right): เครือข่ายพาณิชย์นาวีข้ามสมุทร (Maritime Silk Road & Trade Spheres) -->
  <g id="pillarTrade" transform="translate(1140, 150)">
    <rect width="380" height="240" rx="14" fill="url(#cardGradTrade)" stroke="#2563eb" stroke-width="2" filter="url(#glow)" />
    <!-- Header Badge -->
    <rect x="0" y="0" width="380" height="42" rx="14" fill="#1e40af" />
    <rect x="15" y="12" width="18" height="18" rx="4" fill="#60a5fa" />
    <text x="42" y="26" fill="#eff6ff" font-size="16" font-weight="bold">2. เครือข่ายพาณิชย์นาวีข้ามสมุทร</text>

    <!-- Content Items -->
    <g transform="translate(18, 62)" font-size="13" fill="#dbeafe">
      <circle cx="5" cy="5" r="3.5" fill="#60a5fa" />
      <text x="16" y="9" font-weight="600">เรือเดินสมุทรบาลังไกย์ (Balangay Edge-pegged):</text>
      <text x="16" y="27" fill="#bfdbfe" font-size="12">• ศิลปะต่อเรือกระดานชนแบบออสโตรนีเชียนโบราณ</text>
      <text x="16" y="44" fill="#bfdbfe" font-size="12">• การเดินทางเชื่อมโยงจากบูตูอันสู่จามปา กวางโจว มะละกา</text>

      <circle cx="5" cy="65" r="3.5" fill="#60a5fa" />
      <text x="16" y="69" font-weight="600">การทูตและบรรณาการ (Song Tribute Missions):</text>
      <text x="16" y="87" fill="#bfdbfe" font-size="12">• คณะทูตราชอาณาจักรบูตูอันสู่ราชสำนักซ่ง (ค.ศ. 1001–1011)</text>
      <text x="16" y="104" fill="#bfdbfe" font-size="12">• จารึกแผ่นทองแดงลากูนา (Laguna Copperplate, ค.ศ. 900)</text>

      <circle cx="5" cy="125" r="3.5" fill="#60a5fa" />
      <text x="16" y="129" font-weight="600">การแลกเปลี่ยนสินค้าเกียรติยศ (Prestige Goods):</text>
      <text x="16" y="147" fill="#bfdbfe" font-size="12">• นำเข้าเครื่องเคลือบซ่ง-หยวน-หมิง, ลูกปัดแก้ว, ผ้าไหม</text>
      <text x="16" y="164" fill="#bfdbfe" font-size="12">• ส่งออกทองคำบริสุทธิ์, ไข่มุก, ขี้ผึ้ง, รังนก, ไม้หอม</text>
    </g>
  </g>

  <!-- PILLAR 3 (Bottom-Left): ระบบการเมืองและเศรษฐกิจดาตู (Datu Polities & Prestige Economy) -->
  <g id="pillarEconomy" transform="translate(80, 680)">
    <rect width="380" height="240" rx="14" fill="url(#cardGradEcon)" stroke="#d97706" stroke-width="2" filter="url(#glow)" />
    <!-- Header Badge -->
    <rect x="0" y="0" width="380" height="42" rx="14" fill="#92400e" />
    <rect x="15" y="12" width="18" height="18" rx="4" fill="#f59e0b" />
    <text x="42" y="26" fill="#fef3c7" font-size="16" font-weight="bold">3. เศรษฐกิจการเมืองและโครงสร้างดาตู</text>

    <!-- Content Items -->
    <g transform="translate(18, 62)" font-size="13" fill="#fef3c7">
      <circle cx="5" cy="5" r="3.5" fill="#fbbf24" />
      <text x="16" y="9" font-weight="600">การผูกขาดการค้าและอุปถัมภ์ช่างทอง:</text>
      <text x="16" y="27" fill="#fde68a" font-size="12">• ช่างทองประจำราชสำนักดาตู (Panday Ginto)</text>
      <text x="16" y="44" fill="#fde68a" font-size="12">• การผลิตเครื่องประดับแสดงฐานานุรูป (Regalia)</text>

      <circle cx="5" cy="65" r="3.5" fill="#fbbf24" />
      <text x="16" y="69" font-weight="600">การระดมพันธมิตรและการสงครามทางเรือ:</text>
      <text x="16" y="87" fill="#fde68a" font-size="12">• ประเพณีสงครามชิงทาสและทรัพย์สิน (Mangayaw)</text>
      <text x="16" y="104" fill="#fde68a" font-size="12">• การจัดงานเลี้ยงแจกจ่ายทรัพย์สินสร้างบารมี (Feasting)</text>

      <circle cx="5" cy="125" r="3.5" fill="#fbbf24" />
      <text x="16" y="129" font-weight="600">การจัดลำดับชั้นทางสังคม (Social Stratification):</text>
      <text x="16" y="147" fill="#fde68a" font-size="12">• ชนชั้นปกครองดาตู (Datu) และขุนนาง (Tumao)</text>
      <text x="16" y="164" fill="#fde68a" font-size="12">• ชนชั้นไพร่เสรี (Timawa) และทาสรับใช้ (Oripun)</text>
    </g>
  </g>

  <!-- PILLAR 4 (Bottom-Right): จักรวาลวิทยา โลกหลังความตาย และพิธีกรรม (Cosmology & Ritual Action) -->
  <g id="pillarCosmology" transform="translate(1140, 680)">
    <rect width="380" height="240" rx="14" fill="url(#cardGradCosmo)" stroke="#9333ea" stroke-width="2" filter="url(#glow)" />
    <!-- Header Badge -->
    <rect x="0" y="0" width="380" height="42" rx="14" fill="#6b21a8" />
    <rect x="15" y="12" width="18" height="18" rx="4" fill="#c084fc" />
    <text x="42" y="26" fill="#faf5ff" font-size="16" font-weight="bold">4. จักรวาลวิทยาความตายและพิธีกรรม</text>

    <!-- Content Items -->
    <g transform="translate(18, 62)" font-size="13" fill="#f3e8ff">
      <circle cx="5" cy="5" r="3.5" fill="#c084fc" />
      <text x="16" y="9" font-weight="600">มโนทัศน์ทวิวิญญาณออสโตรนีเชียน (Dual Soul):</text>
      <text x="16" y="27" fill="#e9d5ff" font-size="12">• "ดูงัน" (Dungan) ชีวพลังแห่งความกล้าหาญ-สติปัญญา</text>
      <text x="16" y="44" fill="#e9d5ff" font-size="12">• "กาลัก / อูมาลากัด" (Kalag/Umalagad) วิญญาณบรรพชน</text>

      <circle cx="5" cy="65" r="3.5" fill="#c084fc" />
      <text x="16" y="69" font-weight="600">การปกป้องทวารสรีระ (Aperture Protection):</text>
      <text x="16" y="87" fill="#e9d5ff" font-size="12">• สกัดกั้นภูตอสูรกลืนกินซาก (Asuwang / Busaw)</text>
      <text x="16" y="104" fill="#e9d5ff" font-size="12">• กักเก็บวิญญาณมิให้เล็ดลอดกลายเป็นวิญญาณพเนจร</text>

      <circle cx="5" cy="125" r="3.5" fill="#c084fc" />
      <text x="16" y="129" font-weight="600">การข้ามห้วงน้ำสู่แดนบรรพชน (Soul Voyage):</text>
      <text x="16" y="147" fill="#e9d5ff" font-size="12">• โลงไม้รูปเรือ (Longon) ล่องข้ามแม่น้ำมูรูบูรูสู่ซูลัด</text>
      <text x="16" y="164" fill="#e9d5ff" font-size="12">• แผ่นทองคำปิดปากและในปากเป็น "เสบียงวิญญาณ" (Pabaon)</text>
    </g>
  </g>

  <!-- LOWER PANEL: Scientific Frontiers & Pan-Asian Comparative Matrix -->
  <g id="bottomBar" transform="translate(80, 960)">
    <rect width="1440" height="95" rx="12" fill="url(#cardGradSci)" stroke="#0d9488" stroke-width="1.8" filter="url(#glow)" />
    
    <!-- Title inside panel -->
    <text x="25" y="32" fill="#5eead4" font-size="15" font-weight="bold">5. ระเบียบวิธีวิจัยโบราณคดีวิทยาศาสตร์ยุคใหม่และทิศทางอนาคต (FUTURE ARCHEOMETRIC &amp; SCIENTIFIC HORIZONS)</text>
    
    <!-- 4 Sub-boxes -->
    <g transform="translate(25, 45)" font-size="12" fill="#ccfbf1">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="320" height="38" rx="6" fill="#134e4a" opacity="0.6" stroke="#14b8a6" stroke-width="1" />
        <text x="12" y="16" font-weight="bold" fill="#2dd4bf">• การวิเคราะห์แหล่งกำเนิดตะกั่วไอโซโทป (Lead Isotopes):</text>
        <text x="12" y="30" fill="#99f6e4" font-size="11">ระบุเหมืองทองคำต้นทาง (Agusan vs Surigao vs Masbate vs Luzon)</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(350, 0)">
        <rect width="320" height="38" rx="6" fill="#134e4a" opacity="0.6" stroke="#14b8a6" stroke-width="1" />
        <text x="12" y="16" font-weight="bold" fill="#2dd4bf">• พันธุศาสตร์โบราณและไอโซโทปกระดูก (aDNA &amp; δ18O/δ13C):</text>
        <text x="12" y="30" fill="#99f6e4" font-size="11">การเคลื่อนย้ายประชากร อาหารการกิน และสายตระกูลดาตู</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(700, 0)">
        <rect width="340" height="38" rx="6" fill="#134e4a" opacity="0.6" stroke="#14b8a6" stroke-width="1" />
