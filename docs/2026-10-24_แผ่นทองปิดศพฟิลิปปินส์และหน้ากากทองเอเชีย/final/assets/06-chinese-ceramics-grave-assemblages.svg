<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="celadonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stonewareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="25" width="1140" height="70" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="55" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="0.5">แผนผัง 6.1: วัฒนธรรมวัตถุร่วมสุสาน: ภาชนะดินเผาจีน เครื่องถ้วยเอเชีย และเครื่องอุทิศชนชั้นนำ</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">Grave Goods Assemblage: Chinese Trade Ceramics, Asian Wares, and Datu Elite Regalia in Philippine Precolonial Burials</text>

  <!-- Left Panel: Ceramic Typology & Chronological Horizon -->
  <g transform="translate(40, 115)">
    <rect width="450" height="695" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="35" fill="#38bdf8" font-size="16" font-weight="bold">A. ประเภทวิทยาและลำดับเวลาเครื่องถ้วยการค้าเอเชีย</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Asian Trade Ceramic Horizons (10th–16th Century CE)</text>

    <!-- Item 1: Longquan Celadon -->
    <g transform="translate(25, 75)">
      <rect width="400" height="95" rx="8" fill="#0b1120" stroke="#059669" stroke-width="1"/>
      <circle cx="50" cy="48" r="28" fill="url(#celadonGrad)" stroke="#a7f3d0" stroke-width="1.5"/>
      <!-- Celadon dish stylized ring -->
      <circle cx="50" cy="48" r="14" fill="none" stroke="#065f46" stroke-width="1.2"/>
      <text x="95" y="32" fill="#34d399" font-size="14" font-weight="bold">1. เครื่องเคลือบเซลัดอนเตาหลงเฉวียน (Longquan Celadon)</text>
      <text x="95" y="52" fill="#cbd5e1" font-size="11">อายุ: ราชวงศ์ซ่ง-หยวน (ศตวรรษที่ 12–14) | เคลือบหนาสีเขียวหยกมะกอก</text>
      <text x="95" y="72" fill="#94a3b8" font-size="11">หน้าที่: ชาม จาน ขอบหยัก ลายปลากลางจานนูน วางรองรับศีรษะ/ปลายเท้า</text>
    </g>

    <!-- Item 2: Jingdezhen Blue-and-White -->
    <g transform="translate(25, 185)">
      <rect width="400" height="95" rx="8" fill="#0b1120" stroke="#2563eb" stroke-width="1"/>
      <circle cx="50" cy="48" r="28" fill="url(#blueWhiteGrad)" stroke="#93c5fd" stroke-width="1.5"/>
      <path d="M 40,42 Q 50,32 60,42 Q 50,58 40,42 Z" fill="#1e3a8a"/>
      <text x="95" y="32" fill="#60a5fa" font-size="14" font-weight="bold">2. เครื่องถ้วยลายครามจิ่งเต๋อเจิ้น (Blue-and-White)</text>
      <text x="95" y="52" fill="#cbd5e1" font-size="11">อายุ: ราชวงศ์หยวนตอนปลาย-หมิงตอนต้น (ศตวรรษที่ 14–15)</text>
      <text x="95" y="72" fill="#94a3b8" font-size="11">หน้าที่: ถ้วย ชาม จาน เขียนลายเมฆ คลื่น ดอกบัว ม้ามังกร เป็นเครื่องอุทิศอาหาร</text>
    </g>

    <!-- Item 3: Southeast Asian Mainland Wares (Siam & Annam) -->
    <g transform="translate(25, 295)">
      <rect width="400" height="95" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="50" cy="48" r="28" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="50" cy="48" r="18" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
      <text x="95" y="32" fill="#fbbf24" font-size="14" font-weight="bold">3. เครื่องถ้วยสวรรคโลก-สุโขทัย และเวียดนาม (Annam)</text>
      <text x="95" y="52" fill="#cbd5e1" font-size="11">อายุ: ศตวรรษที่ 14–16 | ถ้วยเคลือบเทาดำ กาดอกบัว และชามเขียนสีใต้เคลือบ</text>
      <text x="95" y="72" fill="#94a3b8" font-size="11">หน้าที่: ภาชนะสำรับน้ำกระสายยา เครื่องหอม น้ำจันทน์บูชาดวงวิญญาณ</text>
    </g>

    <!-- Item 4: Large Martaban Dragon Jars -->
    <g transform="translate(25, 405)">
      <rect width="400" height="110" rx="8" fill="#0b1120" stroke="#ea580c" stroke-width="1"/>
      <!-- Martaban Jar Silhouette -->
      <path d="M 35,25 L 65,25 L 72,50 C 72,70 65,80 50,80 C 35,80 28,70 28,50 Z" fill="url(#stonewareGrad)" stroke="#fdba74" stroke-width="1.5"/>
      <text x="95" y="30" fill="#f97316" font-size="14" font-weight="bold">4. ไหดินเผาเคลือบขนาดใหญ่ลายมังกร (Dragon Jars)</text>
      <text x="95" y="50" fill="#cbd5e1" font-size="11">แหล่งกำเนิด: เตาจีนใต้ (กวางตุ้ง/ฮกเกี้ยน) และเตามาร์ตาบัน</text>
      <text x="95" y="68" fill="#cbd5e1" font-size="11">หูร้อย 4–6 หู ลายมังกรดุนนูนรอบตัวไห เคลือบสีน้ำตาลอมเขียว</text>
      <text x="95" y="86" fill="#94a3b8" font-size="11">หน้าที่: บรรจุสุราข้าวเมาร่วมพิธี Larao / ภาชนะบรรจุกระดูกฝังศพทุติยภูมิ</text>
    </g>

    <!-- Chronological Indicator Bar -->
    <g transform="translate(25, 535)">
      <rect width="400" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="25" fill="#f8fafc" font-size="12" font-weight="bold">การกระจายตัวเชิงปริมาณในสุสานฟิลิปปินส์ (Fox 1959 / Aga-Oglu 1961):</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">• ยุคซ่ง (Song, 960–1279): เซลัดอนหลงเฉวียนช่วงต้น เครื่องถ้วยเต๋อฮว่าสีขาว</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="11">• ยุคหยวน (Yuan, 1271–1368): จานเซลัดอนขนาดใหญ่ ลายครามเตาชูฟู่</text>
      <text x="15" y="90" fill="#cbd5e1" font-size="11">• ยุคหมิง (Ming, 1368–1644): ลายครามจิ่งเต๋อเจิ้น ไหสวรรคโลก ถ้วยอันนัม</text>
      <text x="15" y="115" fill="#38bdf8" font-size="11" font-weight="bold">-> หลุมศพหน้ากากทอง (โอตอน/เซบู): อยู่ในกรอบปลายหยวน-หมิงต้น (1350–1450)</text>
    </g>
  </g>

  <!-- Right Panel: Spatial Layout of Grave Goods & Prestige Hierarchy -->
  <g transform="translate(510, 115)">
    <rect width="650" height="695" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="35" fill="#38bdf8" font-size="16" font-weight="bold">B. การจัดวางเชิงพื้นที่ของชุดเครื่องอุทิศรอบโครงกระดูก (Spatial Zoning)</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Anatomical Zoning of Datu Regalia, Trade Ceramics, and Personal Ornaments</text>

    <!-- Center Skeleton & Coffin Layout Graphic -->
    <g transform="translate(40, 80)">
      <!-- Boat Coffin Contour -->
      <path d="M 120,10 C 20,40 10,480 120,530 C 230,480 220,40 120,10 Z" fill="#0b1120" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8,4"/>
      <text x="75" y="30" fill="#d97706" font-size="11" font-weight="bold">โลงไม้รูปเรือ (Boat Coffin)</text>

      <!-- Stylized Human Skeleton (Extended Supine) -->
      <!-- Skull with Gold Mask -->
      <ellipse cx="120" cy="85" rx="26" ry="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
      <ellipse cx="112" cy="80" rx="7" ry="5" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
      <ellipse cx="128" cy="80" rx="7" ry="5" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
      <polygon points="118,85 122,85 124,96 116,96" fill="#fbbf24"/>
      <path d="M 112,102 Q 120,106 128,102" stroke="#fbbf24" stroke-width="2" fill="none"/>
      <!-- Spine & Ribs -->
      <line x1="120" y1="115" x2="120" y2="280" stroke="#94a3b8" stroke-width="3"/>
      <line x1="100" y1="140" x2="140" y2="140" stroke="#64748b" stroke-width="2"/>
      <line x1="95" y1="160" x2="145" y2="160" stroke="#64748b" stroke-width="2"/>
      <line x1="98" y1="180" x2="142" y2="180" stroke="#64748b" stroke-width="2"/>
      <!-- Pelvis -->
      <ellipse cx="120" cy="280" rx="30" ry="18" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Arms & Hands on Pelvis -->
      <line x1="100" y1="140" x2="85" y2="210" stroke="#64748b" stroke-width="2"/>
      <line x1="85" y1="210" x2="110" y2="275" stroke="#64748b" stroke-width="2"/>
      <line x1="140" y1="140" x2="155" y2="210" stroke="#64748b" stroke-width="2"/>
      <line x1="155" y1="210" x2="130" y2="275" stroke="#64748b" stroke-width="2"/>
      <!-- Legs & Feet -->
      <line x1="108" y1="295" x2="105" y2="440" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="132" y1="295" x2="135" y2="440" stroke="#94a3b8" stroke-width="2.5"/>
      <ellipse cx="102" cy="450" rx="6" ry="10" fill="#64748b"/>
      <ellipse cx="138" cy="450" rx="6" ry="10" fill="#64748b"/>

      <!-- ZONAL ARTIFACT PLACEMENT -->
      <!-- Zone 1: Cranial / Head Zone -->
      <circle cx="60" cy="65" r="18" fill="url(#celadonGrad)" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="180" cy="65" r="18" fill="url(#blueWhiteGrad)" stroke="#60a5fa" stroke-width="1.2"/>
      <!-- Ear Ornaments -->
      <circle cx="86" cy="85" r="5" fill="none" stroke="#fde047" stroke-width="2"/>
      <circle cx="154" cy="85" r="5" fill="none" stroke="#fde047" stroke-width="2"/>

      <!-- Zone 2: Torso & Hand Zone (Weapons & Beads) -->
      <!-- Gold Kris / Dagger at Right Waist -->
      <rect x="150" y="210" width="10" height="90" rx="2" fill="#71717a" stroke="#d4d4d8" stroke-width="1"/>
      <polygon points="148,205 162,205 155,220" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
      <!-- Carnelian Beads scatter on chest -->
      <circle cx="115" cy="150" r="2.5" fill="#ef4444"/>
      <circle cx="122" cy="155" r="2.5" fill="#f97316"/>
      <circle cx="118" cy="162" r="2.5" fill="#ef4444"/>
      <circle cx="125" cy="168" r="2.5" fill="#f59e0b"/>
      <!-- Gold Rings on Fingers -->
      <circle cx="112" cy="278" r="3" fill="#fef08a"/>
      <circle cx="128" cy="278" r="3" fill="#fef08a"/>

      <!-- Zone 3: Lower Extremities & Feet Zone -->
      <!-- Celadon Plate under Feet -->
      <circle cx="120" cy="485" r="22" fill="url(#celadonGrad)" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="120" cy="485" r="10" fill="none" stroke="#065f46" stroke-width="1"/>
      <!-- Food Offerings Cups beside Legs -->
      <circle cx="65" cy="380" r="14" fill="url(#blueWhiteGrad)" stroke="#60a5fa" stroke-width="1"/>
      <circle cx="175" cy="380" r="14" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>

      <!-- External Martaban Jar beside Coffin -->
      <path d="M 230,400 L 260,400 L 268,435 C 268,460 260,470 245,470 C 230,470 222,460 222,435 Z" fill="url(#stonewareGrad)" stroke="#fdba74" stroke-width="1.5"/>
      <text x="210" y="490" fill="#fdba74" font-size="10" font-weight="bold">ไหสุราข้างโลง (Larao)</text>
    </g>

    <!-- Spatial Annotations Panel (Right of graphic) -->
    <g transform="translate(320, 80)">
      <!-- Zone 1 Callout -->
      <rect width="295" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="bold">โซน 1: สรีระส่วนศีรษะ (Cranial Zone)</text>
      <text x="12" y="44" fill="#cbd5e1" font-size="11">• แผ่นทองคำปิดตา จมูก ปาก (Orifice covers)</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="11">• ต่างหูทองคำทรงห่วงหนา (Panika / Orejeira)</text>
      <text x="12" y="80" fill="#cbd5e1" font-size="11">• ชามเซลัดอน/ลายคราม ขนาบข้างกะโหลก</text>
      <text x="12" y="98" fill="#94a3b8" font-size="10">ความหมาย: พิทักษ์ผัสสะและแสดงศักดิ์ดาตูสูงสุด</text>

      <!-- Zone 2 Callout -->
      <g transform="translate(0, 125)">
        <rect width="295" height="125" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="12" y="24" fill="#fbbf24" font-size="12" font-weight="bold">โซน 2: ลำตัว เอว และมือ (Torso &amp; Hand Zone)</text>
        <text x="12" y="44" fill="#cbd5e1" font-size="11">• กริชด้ามทอง/ดาบเหล็ก (Kris / Barong) ข้างเอว</text>
        <text x="12" y="62" fill="#cbd5e1" font-size="11">• ลูกปัดคาร์เนเลียน อะเกต แก้วหลากสีบนหน้าอก</text>
        <text x="12" y="80" fill="#cbd5e1" font-size="11">• แหวนทองคำสวมบนนิ้วมือที่วางกุมบนเชิงกราน</text>
        <text x="12" y="98" fill="#cbd5e1" font-size="11">• ผ้าไหมจีน/ผ้าฝ้ายทอพิเศษห่อหุ้มลำตัว</text>
        <text x="12" y="116" fill="#94a3b8" font-size="10">ความหมาย: อำนาจทางทหาร การรบ และสายสัมพันธ์เครือญาติ</text>
      </g>

      <!-- Zone 3 Callout -->
      <g transform="translate(0, 265)">
        <rect width="295" height="115" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="24" fill="#34d399" font-size="12" font-weight="bold">โซน 3: ขา ปลายเท้า และภายนอกโลง</text>
        <text x="12" y="44" fill="#cbd5e1" font-size="11">• จานเซลัดอนขนาดใหญ่รองรับใต้ปลายเท้า</text>
        <text x="12" y="62" fill="#cbd5e1" font-size="11">• ถ้วยชามอุทิศอาหารกระสายยาขนาบข้างเข่า</text>
        <text x="12" y="80" fill="#cbd5e1" font-size="11">• ไหหินดินเผาเคลือบ (Dragon jar) บรรจุสุรานอกโลง</text>
        <text x="12" y="98" fill="#94a3b8" font-size="10">ความหมาย: เสบียงข้ามภพและการเฉลิมฉลองเกียรติยศ</text>
      </g>

      <!-- Prestige Value Index Box -->
      <g transform="translate(0, 395)">
        <rect width="295" height="135" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1.2"/>
        <text x="12" y="24" fill="#c084fc" font-size="12" font-weight="bold">ดัชนีคุณค่าหลุมศพ (Prestige Value - Barretto 2003):</text>
        <text x="12" y="46" fill="#e2e8f0" font-size="11">ทองคำ 1 ชิ้น &gt; เครื่องเคลือบจีนนำเข้า 10 ใบ</text>
        <text x="12" y="66" fill="#cbd5e1" font-size="10.5">การผสมผสานระหว่าง "ทองคำในสรีระ" (Inalienable)</text>
        <text x="12" y="84" fill="#cbd5e1" font-size="10.5">กับ "เครื่องเคลือบจีนนำเข้า" (Alienable Capital)</text>
        <text x="12" y="104" fill="#cbd5e1" font-size="10.5">คือเครื่องชี้วัดชนชั้นนำระดับสูงสุด (Type 1 Elites)</text>
        <text x="12" y="122" fill="#38bdf8" font-size="10">ที่ผูกขาดเครือข่ายพาณิชย์นาวีในทะเลวิสายาส์-มินดาเนา</text>
      </g>
    </g>
  </g>
</svg>
