<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1270" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#A85B12"/>
    </marker>
    <path id="starPH" d="M0,-14 L3.48,-4.79 L13.31,-4.33 L5.63,1.83 L8.21,11.33 L0,5.92 L-8.21,11.33 L-5.63,1.83 L-13.31,-4.33 L-3.48,-4.79 Z"/>
  </defs>

  <!-- พื้นทะเล -->
  <rect x="0" y="0" width="1600" height="1270" fill="#D8E6EF"/>

  <!-- หัวเรื่อง -->
  <text x="800" y="46" text-anchor="middle" font-size="34" font-weight="bold" fill="#3B2F1E">แผนที่ที่ 1.1: แหล่งหน้ากากทองปิดศพและแผ่นทองปิดหน้าศพในเอเชีย</text>
  <text x="800" y="80" text-anchor="middle" font-size="21" fill="#5A4A30">แหล่งแกนกลางสามแห่งในฟิลิปปินส์ เทียบเคียงกับแหล่งในเวียดนาม กัมพูชา อินโดนีเซีย และจีน (แผนที่เชิงสัญลักษณ์ ตำแหน่งโดยประมาณตามภูมิศาสตร์จริง)</text>

  <!-- เส้นโครงองศา (graticule) -->
  <g stroke="#B9C9D6" stroke-width="1" stroke-dasharray="4 6">
    <line x1="335" y1="140" x2="335" y2="1235"/>
    <line x1="607" y1="140" x2="607" y2="1235"/>
    <line x1="878" y1="140" x2="878" y2="1235"/>
    <line x1="1150" y1="140" x2="1150" y2="1235"/>
    <line x1="110" y1="401" x2="1460" y2="401"/>
    <line x1="110" y1="674" x2="1460" y2="674"/>
    <line x1="110" y1="946" x2="1460" y2="946"/>
  </g>
  <g font-size="13" fill="#7B8B99">
    <text x="335" y="134" text-anchor="middle">75°อ.</text>
    <text x="607" y="134" text-anchor="middle">90°อ.</text>
    <text x="878" y="134" text-anchor="middle">105°อ.</text>
    <text x="1150" y="134" text-anchor="middle">120°อ.</text>
    <text x="116" y="405">30°เหนือ</text>
    <text x="116" y="678">15°เหนือ</text>
    <text x="116" y="950">เส้นศูนย์สูตร</text>
  </g>

  <!-- แผ่นดินใหญ่เอเชีย -->
  <path d="M110,587 L599,587 L653,605 L698,696 L724,690 L748,696 L767,751 L762,829 L784,857 L802,884 L821,921 L862,952 L857,914 L839,875 L802,829 L807,750 L828,771 L846,784 L874,797 L871,823 L894,812 L919,804 L926,798 L952,780 L965,765 L965,736 L942,685 L919,638 L901,600 L939,587 L973,592 L1040,571 L1151,505 L1188,421 L1206,326 L1164,271 L1189,262 L1234,260 L1257,294 L1265,352 L1311,334 L1329,209 L1363,150 L110,150 Z"
        fill="#EFE7D4" stroke="#93815F" stroke-width="2.5"/>

  <!-- เกาะต่าง ๆ -->
  <ellipse cx="976" cy="628" rx="14" ry="17" fill="#EFE7D4" stroke="#93815F" stroke-width="2"/>
  <path d="M1145,535 L1150,510 L1160,507 L1163,530 L1155,541 Z" fill="#EFE7D4" stroke="#93815F" stroke-width="2"/>
  <!-- ลูซอน -->
  <path d="M1137,647 L1140,696 L1133,718 L1151,723 L1164,734 L1199,751 L1196,723 L1191,687 L1182,656 Z" fill="#EFE7D4" stroke="#93815F" stroke-width="2"/>
  <ellipse cx="1148" cy="748" rx="9" ry="7" fill="#EFE7D4" stroke="#93815F" stroke-width="1.5"/>
